name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false  # no third-party modules

      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "Run gofmt"; exit 1; }
          go vet ./...
          go test -race ./...

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Compiled CSS is up to date
        run: |
          npm ci
          npm run build:css
          git diff --exit-code -- web/static/assets/app.css || { echo "::error::Run 'npm run build:css' and commit web/static/assets/app.css"; exit 1; }

      - name: Lint install script
        run: shellcheck scripts/install.sh

      - name: GoReleaser config & snapshot build
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "v2.20.0"
          args: release --snapshot --clean --skip=publish
